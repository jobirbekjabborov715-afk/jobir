<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>jac — 3D robot</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  #app { position:fixed; inset:0; background:radial-gradient(120% 100% at 50% 35%, #eef2f6 0%, #d3dae2 65%, #b3bcc6 100%); }
  canvas { display:block; }
  #hud { position:fixed; left:0; right:0; bottom:24px; display:flex; flex-direction:column; align-items:center; gap:12px; pointer-events:none; }
  #state { display:flex; align-items:center; gap:10px; font-size:21px; font-weight:700; color:#2a2e35; }
  #dot { width:15px; height:15px; border-radius:50%; box-shadow:0 0 14px currentColor; }
  #btns { display:flex; gap:7px; pointer-events:auto; flex-wrap:wrap; justify-content:center; }
  #btns button { border:none; border-radius:999px; padding:8px 15px; font-size:13px; font-weight:600;
    background:rgba(255,255,255,.78); color:#2a2e35; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  #btns button.active { background:#2a2e35; color:#fff; }
  #brand { position:fixed; top:16px; left:18px; font-weight:800; letter-spacing:3px; color:#2a2e35; font-size:20px; }
  #hint { position:fixed; top:18px; left:0; right:0; text-align:center; color:#5a6573; font-size:13px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="brand">jac</div>
<div id="hint">Robot o'zi harakatlanadi · sichqonchani kuzatadi · ushlab aylantiring</div>
<div id="hud">
  <div id="state"><span id="dot"></span><span id="label">suzyapman</span></div>
  <div id="btns">
    <button data-s="auto" class="active">Avto</button>
    <button data-s="hello">Salom</button>
    <button data-s="ready">Tayyor</button>
    <button data-s="think">O'ylayapman</button>
    <button data-s="error">Xato</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';
import { RoundedBoxGeometry } from './vendor/RoundedBoxGeometry.js';

const STATES = {
  hello: { c:0x37d6ff, label:'Salom!' }, ready:{ c:0x33ff6a, label:'Tayyorman' },
  think: { c:0xffb02e, label:"O'ylayapman..." }, error:{ c:0xff4d4d, label:'Xato topildi!' },
};
const ORDER = ['hello','ready','think','error'];
let colorMode = 'auto';   // 'auto' or a state key

const app = document.getElementById('app');
const W = ()=>app.clientWidth, H = ()=>app.clientHeight;
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W(),H());
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, W()/H(), 0.1, 100);
camera.position.set(0, 0.4, 6.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 4; controls.maxDistance = 10; controls.target.set(0,-0.1,0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x404a55, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(-3,5,4); key.castShadow = true;
key.shadow.mapSize.set(1024,1024); key.shadow.radius = 6;
key.shadow.camera.near = 1; key.shadow.camera.far = 25; scene.add(key);
const rim = new THREE.DirectionalLight(0x9fd8ff, 0.6); rim.position.set(4,2,-3); scene.add(rim);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,60), new THREE.ShadowMaterial({ opacity:0.20 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -2.2; ground.receiveShadow = true; scene.add(ground);

// ---------- robot ----------
const robot = new THREE.Group(); scene.add(robot);
const matBody = new THREE.MeshStandardMaterial({ color:0x33383f, metalness:0.35, roughness:0.55 });
const matDark = new THREE.MeshStandardMaterial({ color:0x070a0d, metalness:0.2, roughness:0.45 });
const body = new THREE.Mesh(new RoundedBoxGeometry(1.05,0.95,0.9,5,0.34), matBody.clone());
body.position.y = -1.35; body.castShadow = true; robot.add(body);
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.27,0.32,0.4,24), matBody.clone());
neck.position.y = -0.78; neck.castShadow = true; robot.add(neck);
const head = new THREE.Group(); robot.add(head);
const headMesh = new THREE.Mesh(new RoundedBoxGeometry(1.75,1.6,1.5,6,0.5), matBody.clone());
headMesh.castShadow = true; head.add(headMesh);
const panel = new THREE.Mesh(new RoundedBoxGeometry(1.28,1.06,0.2,4,0.34), matDark.clone());
panel.position.z = 0.7; head.add(panel);
const eyeMat = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:STATES.hello.c, emissiveIntensity:1.6, roughness:0.3 });
const eyeGeo = new RoundedBoxGeometry(0.26,0.42,0.16,3,0.09);
const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.27,0,0.82); head.add(eyeL);
const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set( 0.27,0,0.82); head.add(eyeR);
const ledMat = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:STATES.hello.c, emissiveIntensity:1.4 });
const led = new THREE.Mesh(new THREE.SphereGeometry(0.06,16,16), ledMat); led.position.set(0,0.78,0.62); head.add(led);

// ---------- "movement brain": varied, self-directed floating ----------
const BOUNDS = { x:2.4, yTop:0.9, yBot:-1.0, zNear:1.2, zFar:-1.8 };
const logical = new THREE.Vector3(0,-0.1,0);
const target  = new THREE.Vector3(0,-0.1,0);
const mouse = { x:0, y:0, active:false };
let behavior='idle', behaviorTime=0, behaviorDur=2, spinT=0, extraYaw=0;
const rand=(a,b)=>a+Math.random()*(b-a);

const BEHAVIORS = [
  { k:'wander',  uz:'suzyapman',          w:4 },
  { k:'idle',    uz:'dam olyapman',       w:2 },
  { k:'curious', uz:'atrofni kuzatyapman',w:2 },
  { k:'spin',    uz:'aylanyapman',        w:1 },
  { k:'zoom',    uz:'yaqinlashyapman',    w:1 },
  { k:'gaze',    uz:'sizga qarayapman',   w:2 },
];
function pickBehavior(){
  const tot = BEHAVIORS.reduce((s,b)=>s+b.w,0); let r=Math.random()*tot, pick=BEHAVIORS[0];
  for(const b of BEHAVIORS){ r-=b.w; if(r<=0){ pick=b; break; } }
  behavior = pick.k; behaviorLabel = pick.uz; behaviorTime = 0; spinT = 0;
  if(behavior==='wander'){ target.set(rand(-BOUNDS.x,BOUNDS.x), rand(BOUNDS.yBot,BOUNDS.yTop), rand(BOUNDS.zFar,0)); behaviorDur=rand(2.6,4.4); }
  else if(behavior==='idle'){ target.copy(logical); behaviorDur=rand(1.6,2.8); }
  else if(behavior==='curious'){ target.set(logical.x, logical.y, logical.z); behaviorDur=rand(2.2,3.4); }
  else if(behavior==='spin'){ behaviorDur=1.3; }
  else if(behavior==='zoom'){ target.set(rand(-1,1), rand(-0.4,0.5), BOUNDS.zNear); behaviorDur=rand(1.6,2.4); }
  else if(behavior==='gaze'){ behaviorDur=rand(1.8,3.0); }
}
let behaviorLabel='suzyapman'; pickBehavior();

addEventListener('pointermove', e=>{
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-r.left)/r.width)*2-1; mouse.y = ((e.clientY-r.top)/r.height)*2-1; mouse.active=true;
});

function autoColor(t){
  const seg=t*ORDER.length, i=Math.floor(seg)%ORDER.length, j=(i+1)%ORDER.length;
  let f=seg-Math.floor(seg); f=f<0.5?0:(f-0.5)*2;
  const a=STATES[ORDER[i]].c,b=STATES[ORDER[j]].c;
  const lh=(x,y,k)=>((((x>>16&255)+(((y>>16&255)-(x>>16&255))*k)|0)<<16)|(((x>>8&255)+(((y>>8&255)-(x>>8&255))*k)|0)<<8)|((x&255)+(((y&255)-(x&255))*k)|0));
  return { c:lh(a,b,f), label: STATES[ORDER[f<0.5?i:j]].label };
}
const dotEl=document.getElementById('dot'), labelEl=document.getElementById('label');

function updateBrain(dt, t){
  behaviorTime += dt;
  if(behaviorTime > behaviorDur) pickBehavior();
  // ease toward target
  const k = 1-Math.exp(-dt*2.0);
  logical.x += (target.x-logical.x)*k;
  logical.y += (target.y-logical.y)*k;
  logical.z += (target.z-logical.z)*k;
  const bob = Math.sin(t*2.0)*0.06;
  robot.position.set(logical.x, logical.y+bob, logical.z);

  // desired head facing: travel direction + mouse awareness (+ behavior)
  let dyaw = (target.x-logical.x)*0.5;
  let dpitch = -(target.y-logical.y)*0.3;
  let aware = behavior==='gaze' ? 0.6 : 0.18;
  if(mouse.active){ dyaw += mouse.x*aware; dpitch += -mouse.y*aware*0.7; }
  if(behavior==='curious'){ dyaw += Math.sin(t*1.6)*0.5; dpitch += Math.sin(t*1.1)*0.12; }
  head.rotation.y += (THREE.MathUtils.clamp(dyaw,-0.7,0.7) - head.rotation.y)*Math.min(1,dt*4);
  head.rotation.x += (THREE.MathUtils.clamp(dpitch,-0.4,0.4) - head.rotation.x)*Math.min(1,dt*4);
  head.rotation.z = Math.sin(t*0.6)*0.05;

  // spin behavior turns the whole robot
  let targetSpin = 0;
  if(behavior==='spin'){ spinT += dt; targetSpin = (spinT/behaviorDur)*Math.PI*2; robot.rotation.y = targetSpin; }
  else { robot.rotation.y += (0 - robot.rotation.y)*Math.min(1,dt*3); }

  // blink
  const bt = (t*0.12)%1; let blink=1;
  for(const bc of [0.30,0.78]){ const d=Math.min(Math.abs(bt-bc),Math.abs(bt-bc+1),Math.abs(bt-bc-1)); if(d<0.02) blink=0.12; }
  eyeL.scale.y = eyeR.scale.y = blink;

  // colors / state
  const pulse = 1.25 + 0.5*(0.5+0.5*Math.sin(t*1.3));
  eyeMat.emissiveIntensity=pulse; ledMat.emissiveIntensity=pulse*0.9;
  let col, slabel;
  if(colorMode==='auto'){ const s=autoColor((t*0.06)%1); col=s.c; slabel=behaviorLabel; }
  else { col=STATES[colorMode].c; slabel=STATES[colorMode].label; }
  eyeMat.emissive.setHex(col); ledMat.emissive.setHex(col);
  const hexs='#'+col.toString(16).padStart(6,'0');
  dotEl.style.background=hexs; dotEl.style.color=hexs; labelEl.textContent=slabel;
}

document.querySelectorAll('#btns button').forEach(b=>{
  b.onclick=()=>{ colorMode=b.dataset.s; document.querySelectorAll('#btns button').forEach(x=>x.classList.toggle('active',x===b)); };
});
addEventListener('resize', ()=>{ camera.aspect=W()/H(); camera.updateProjectionMatrix(); renderer.setSize(W(),H()); });

const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  updateBrain(dt, t);
  controls.update();
  renderer.render(scene, camera);
}
window.jacReady = true;
loop();
</script>
</body>
</html>
